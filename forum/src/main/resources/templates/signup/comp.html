<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>会員登録：登録完了</title>
	<link th:href="@{/css/signup/input.css}" rel="stylesheet">
</head>
<body>
	<header th:replace="~{fragments/header :: headerFragments}"></header>
	
	<main>
		<fieldset>
			<legend>
				<h1>会員登録</h1>
			</legend>
			<th:block th:if="${error} == ''">
				<h3>本登録が完了しました。</h3>
			</th:block>
			<th:block th:unless="${error} == ''">
				<h3><span th:text="${error}"></span></h3>
			</th:block>
		</fieldset>
	</main>
	
	<footer th:replace="~{fragments/footer :: footerFragments}"></footer>
</body>
</html>
