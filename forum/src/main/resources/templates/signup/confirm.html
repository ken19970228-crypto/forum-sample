<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>会員登録：確認画面</title>
	<link th:href="@{/css/signup/input.css}" rel="stylesheet">
</head>
<body>
	<header th:replace="~{fragments/header :: headerFragments}"></header>
	
	<main>
		<fieldset>
			<legend>
				<h1>入力確認</h1>
			</legend>
			<h2>下記内容で登録します。</h2>
			<h3 class="error" th:text="${error}"></h3>
			<form>
				<table>
					<tr>
						<th>
							<label for="email">メールアドレス：</label>
						</th>
						<td>
							<input type="email" name="email" th:value="${data.email}" readonly>
						</td>
					</tr>
					<tr>
						<th>
							<label for="nickname">ニックネーム：</label>
						</th>
						<td>
							<input type="text" name="nickname" th:value="${data.nickname}" readonly>
						</td>
					</tr>
					<tr>
						<th>
							<label for="password">パスワード：</label>
						</th>
						<td>
							<input type="text" name="password" value="**********" readonly>
						</td>
					</tr>
					<tr id="button">
						<td>
							<input type="submit" value="登録" formmethod="post" formaction="/signup/registration">
						</td>
						<td>
							<input type="submit" value="戻る" formmethod="get" formaction="/signup/return">
						</td>
					</tr>
				</table>
			</form>
		</fieldset>
		
		
	</main>
	
	
	<footer th:replace="~{fragments/footer :: footerFragments}"></footer>
</body>
</html>
